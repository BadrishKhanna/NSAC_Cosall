services:
  - type: web
    name: cosall-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-api.txt && python backend/download_data.py
    startCommand: cd backend && python -c "from api import kernels_self_test; kernels_self_test()" && uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

  - type: web
    name: cosall
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
